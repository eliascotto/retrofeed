<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --panel: #fff;
    --border: #e3e3e3;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --accent-text: #fff;
    --danger: #b91c1c;
    --success-bg: #dcfce7;
    --success-text: #166534;
    --neutral-bg: #f1f1f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --panel: #1a1a1a;
      --border: #2a2a2a;
      --text: #f1f1f1;
      --muted: #9a9a9a;
      --accent: #3b82f6;
      --success-bg: #052e16;
      --success-text: #86efac;
      --neutral-bg: #222;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
  }
  .sidebar__header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .sidebar__list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .sidebar__item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .sidebar__item:hover { background: var(--neutral-bg); }
  .sidebar__item--active { background: var(--neutral-bg); font-weight: 600; }
  .badge {
    background: var(--neutral-bg);
    color: var(--muted);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .main {
    overflow-y: auto;
    padding: 24px 32px;
  }
  .main__empty {
    color: var(--muted);
    padding: 80px 0;
    text-align: center;
  }
  .main__header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 16px;
  }
  .main__title {
    margin: 0 0 4px;
    font-size: 20px;
  }
  .main__subtitle {
    color: var(--muted);
    margin: 0;
  }
  .main__subtitle a { color: var(--accent); }
  .main__actions {
    display: flex;
    gap: 8px;
  }
  .button {
    background: var(--neutral-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  .button:hover { border-color: var(--accent); }
  .button--primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .table th, .table td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .table th {
    font-weight: 600;
    background: var(--neutral-bg);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .table tr:last-child td { border-bottom: none; }
  .order {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 48px;
  }
  .date {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    width: 110px;
  }
  .title a { color: var(--text); text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .status {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    white-space: nowrap;
  }
  .status--published { background: var(--success-bg); color: var(--success-text); }
  .status--unpublished { background: var(--neutral-bg); color: var(--muted); }
  .action-cell { width: 120px; text-align: right; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar__header">Fixtures</div>
    <ul class="sidebar__list" id="fixture-list"></ul>
  </aside>
  <main class="main" id="main">
    <div class="main__empty">Select a fixture from the left.</div>
  </main>
</div>
<script>
  const listEl = document.getElementById("fixture-list");
  const mainEl = document.getElementById("main");
  let selected = null;
  let fixtures = [];

  async function loadFixtures() {
    const res = await fetch("/api/fixtures");
    fixtures = await res.json();
    renderSidebar();
    if (selected && fixtures.some((f) => f.name === selected)) {
      // refresh badge counts already shown
    }
  }

  function renderSidebar() {
    listEl.innerHTML = "";
    for (const f of fixtures) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "sidebar__item" + (selected === f.name ? " sidebar__item--active" : "");
      btn.type = "button";
      const name = document.createElement("span");
      name.textContent = f.name;
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = f.publishedCount + " / " + f.total;
      btn.appendChild(name);
      btn.appendChild(badge);
      btn.addEventListener("click", () => selectFixture(f.name));
      li.appendChild(btn);
      listEl.appendChild(li);
    }
  }

  async function selectFixture(name) {
    selected = name;
    renderSidebar();
    await renderDetail();
  }

  async function renderDetail() {
    if (!selected) return;
    const res = await fetch("/api/fixtures/" + encodeURIComponent(selected));
    if (!res.ok) {
      mainEl.innerHTML = '<div class="main__empty">Failed to load fixture.</div>';
      return;
    }
    const data = await res.json();
    const port = location.port || (location.protocol === "https:" ? "443" : "80");
    const subdomainBase = location.protocol + "//" + selected + ".localhost:" + port;

    const header = document.createElement("div");
    header.className = "main__header";
    header.innerHTML =
      '<div>' +
      '<h1 class="main__title">' + escapeHtml(selected) + '</h1>' +
      '<p class="main__subtitle">' +
      '<a href="' + subdomainBase + '/" target="_blank" rel="noopener">' + subdomainBase + '/</a>' +
      '</p>' +
      '</div>' +
      '<div class="main__actions">' +
      '<button class="button" data-action="reset">Reset</button>' +
      '<button class="button" data-action="unpublish-all">Unpublish all</button>' +
      '<button class="button button--primary" data-action="publish-all">Publish all</button>' +
      '</div>';

    const table = document.createElement("table");
    table.className = "table";
    table.innerHTML =
      '<thead><tr>' +
      '<th class="order">#</th>' +
      '<th class="date">Date</th>' +
      '<th>Title</th>' +
      '<th>Status</th>' +
      '<th class="action-cell"></th>' +
      '</tr></thead>';

    const tbody = document.createElement("tbody");
    for (const a of data.articles) {
      const tr = document.createElement("tr");
      tr.dataset.order = a.order;
      const articleUrl = a.path ? (subdomainBase + a.path) : null;
      tr.innerHTML =
        '<td class="order">' + a.order + '</td>' +
        '<td class="date">' + escapeHtml(a.date || "") + '</td>' +
        '<td class="title">' +
        (articleUrl
          ? '<a href="' + articleUrl + '" target="_blank" rel="noopener">' + escapeHtml(a.title) + '</a>'
          : escapeHtml(a.title)) +
        '</td>' +
        '<td>' + statusBadge(a.published) + '</td>' +
        '<td class="action-cell">' +
        '<button class="button" data-toggle="' + a.order + '" data-published="' + a.published + '">' +
        (a.published ? "Unpublish" : "Publish") +
        '</button>' +
        '</td>';
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    mainEl.innerHTML = "";
    mainEl.appendChild(header);
    mainEl.appendChild(table);

    header.querySelectorAll("button[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => bulkAction(btn.dataset.action));
    });
    tbody.querySelectorAll("button[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => togglePublish(parseInt(btn.dataset.toggle, 10), btn.dataset.published === "true"));
    });
  }

  function statusBadge(published) {
    if (published) {
      return '<span class="status status--published">Published</span>';
    } else {
      return '<span class="status status--unpublished">Unpublished</span>';
    }
  }

  async function togglePublish(order, currentlyPublished) {
    const method = currentlyPublished ? "DELETE" : "POST";
    const res = await fetch("/api/fixtures/" + encodeURIComponent(selected) + "/articles/" + order + "/publish", { method });
    if (!res.ok) {
      alert("Request failed: " + res.status);
      return;
    }
    await Promise.all([loadFixtures(), renderDetail()]);
  }

  async function bulkAction(action) {
    const res = await fetch("/api/fixtures/" + encodeURIComponent(selected) + "/" + action, { method: "POST" });
    if (!res.ok) {
      alert("Request failed: " + res.status);
      return;
    }
    await Promise.all([loadFixtures(), renderDetail()]);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[c]);
  }

  loadFixtures();
</script>
</body>
</html>

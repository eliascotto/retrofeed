# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 7 } %>

development:
  primary:
    <<: *default
    database: retrofeed_dev
  queue:
    <<: *default
    database: retrofeed_dev_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: retrofeed_dev_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: retrofeed_test
  queue:
    <<: *default
    database: retrofeed_test_queue
    migrations_paths: db/queue_migrate

# Production uses PostgreSQL via DATABASE_URL environment variable.
# Set DATABASE_URL in your production environment (e.g., postgresql://user:password@host:port/database)
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 7 } %>
  cache:
    <<: *primary_production
    database: retrofeed_prod_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: retrofeed_prod_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: retrofeed_prod_cable
    migrations_paths: db/cable_migrate

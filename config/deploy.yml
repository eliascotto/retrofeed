service: retrofeed

image: <%= ENV.fetch("KAMAL_IMAGE") %>

servers:
  web:
    - <%= ENV.fetch("DEPLOY_SERVER") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST") %>
  healthcheck:
    path: /up
    interval: 3

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  # Secrets from .env exposed to the application
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - RESEND_API_KEY
    - MAILER_FROM_EMAIL
    - APP_HOST
    - WEBSITE_ARCHIVE_INTERVAL
    - WEBSITE_ARCHIVE_MIN_INTERVAL
    - ARTICLE_CONTENT_INTERVAL
    - ARTICLE_CONTENT_MIN_INTERVAL
  clear:
    SOLID_QUEUE_IN_PUMA: true

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("DEPLOY_SERVER") %>
    env:
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DB
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "retrofeed_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: arm64
  ssh: default
  cache:
    type: registry

ssh:
  keys:
    - <%= ENV.fetch("DEPLOY_SSH_KEY") %>
